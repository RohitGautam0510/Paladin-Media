[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paladinmedia"
version = "0.1.0"
dependencies = [
    "cryptography>=41.0.0",
    "reedsolo>=1.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
